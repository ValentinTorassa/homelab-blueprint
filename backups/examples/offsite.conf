# Sourced by the offsite job: which snapshot families go to S3, and how often.
# Small, fast-changing families go daily (RPO 24h); large, mostly-media ones go
# weekly to keep the retained footprint sane (RPO 7 days).
#
# The job refuses to ship a `latest` that is missing, older than 36h or EMPTY.
# Secrets (.env files, tunnel credentials) travel separately, as one
# gpg-encrypted bundle whose passphrase lives outside this system.
DAILY=(app-a mailer)
WEEKLY=(blog)

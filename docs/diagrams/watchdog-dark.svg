<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 196" width="760" height="196" role="img" aria-labelledby="title desc">
<title id="title">Dead man&#x27;s switch for the monitor</title>
<desc id="desc">The relay checks the age of the monitor&#x27;s last signed heartbeat on its own schedule. Healthy moves to warning when beats stop, and to critical when they are still missing. When a heartbeat arrives, it sends exactly one recovery message and returns to healthy.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:#f0f6fc}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.t{font-size:14px;font-weight:600}
.s{font-size:12px;fill:#9198a1}
.l{font-size:12px;font-weight:500}
.cap{font-size:11px;font-weight:600;letter-spacing:.08em;fill:#9198a1}
.chipt{font-size:11px;fill:#9198a1}
.panel{fill:#151b23;stroke:#3d444d}
.node{fill:#212830;stroke:#3d444d;stroke-width:1.25}
.chip{fill:#2a313c}
.icon{fill:none;stroke:#9198a1;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.e{fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.dash{stroke-dasharray:5 4}
.life{stroke:#3d444d;stroke-width:1.25;stroke-dasharray:3 4}
.badge{font-size:10px;font-weight:700;fill:#0d1117}
</style>
<defs><marker id="m-mon" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1L9,5L1,9z" fill="#4493f8"/></marker><marker id="m-bak" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1L9,5L1,9z" fill="#3fb950"/></marker><marker id="m-drf" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1L9,5L1,9z" fill="#ab7df8"/></marker><marker id="m-sby" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1L9,5L1,9z" fill="#f0883e"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1L9,5L1,9z" fill="#f85149"/></marker><marker id="m-warn" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1L9,5L1,9z" fill="#d29922"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1L9,5L1,9z" fill="#9198a1"/></marker></defs>
<rect x="40" y="40" width="160" height="56" rx="12" class="node" style="stroke:#3fb950;stroke-width:1.75"/>
<circle cx="62" cy="62" r="5" fill="#3fb950"/>
<text x="76" y="66" class="t" text-anchor="start" style="fill:#3fb950;">healthy</text>
<text x="76" y="84" class="s" text-anchor="start">beats arriving</text>
<rect x="300" y="40" width="160" height="56" rx="12" class="node" style="stroke:#d29922;stroke-width:1.75"/>
<circle cx="322" cy="62" r="5" fill="#d29922"/>
<text x="336" y="66" class="t" text-anchor="start" style="fill:#d29922;">warning</text>
<text x="336" y="84" class="s" text-anchor="start">one message</text>
<rect x="560" y="40" width="160" height="56" rx="12" class="node" style="stroke:#f85149;stroke-width:1.75"/>
<circle cx="582" cy="62" r="5" fill="#f85149"/>
<text x="596" y="66" class="t" text-anchor="start" style="fill:#f85149;">critical</text>
<text x="596" y="84" class="s" text-anchor="start">one message</text>
<path d="M200,68 L300,68" class="e" stroke="#d29922" marker-end="url(#m-warn)"/>
<text x="250" y="60" class="l" text-anchor="middle" style="fill:#d29922;">beats stop</text>
<path d="M460,68 L560,68" class="e" stroke="#f85149" marker-end="url(#m-bad)"/>
<text x="510" y="60" class="l" text-anchor="middle" style="fill:#f85149;">still missing</text>
<path d="M640,96 L640,132 Q640,140 632,140 L128,140 Q120,140 120,132 L120,96" class="e" stroke="#3fb950" marker-end="url(#m-bak)"/>
<path d="M380,96 L380,140" class="e" stroke="#3fb950"/>
<text x="380" y="164" class="l" text-anchor="middle" style="fill:#3fb950;">a heartbeat arrives: exactly one recovery message</text>
<text x="380" y="186" class="s" text-anchor="middle">the relay checks the age of the last signed beat on its own schedule</text>
</svg>
